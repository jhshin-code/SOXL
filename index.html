<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 매도 매니저</title>
    <style>
        :root { --primary: #007bff; --buy: #ff4d4d; --sell: #2ecc71; --bg: #f2f4f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .card { background: #fff; padding: 18px; border-radius: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        /* 티커 선택 */
        .ticker-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .ticker-btn { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 10px; background: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .ticker-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .custom-ticker { display: flex; gap: 8px; margin-top: 8px; }
        .custom-ticker input { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 10px; font-size: 0.9rem; text-transform: uppercase; }
        .custom-ticker button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* 기간 선택 버튼 */
        .period-selector { display: flex; gap: 6px; margin-top: 10px; justify-content: center; }
        .period-btn { padding: 6px 14px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s; color: #666; }
        .period-btn.active { background: #2ecc71; color: white; border-color: #2ecc71; }
        .period-btn:hover { border-color: #2ecc71; }

        /* 상단 시세 박스 */
        .ticker-display { text-align: center; font-size: 1.2rem; font-weight: bold; color: #666; margin-bottom: 5px; }
        .price-main { font-size: 2.8rem; font-weight: 800; color: var(--primary); text-align: center; margin: 5px 0; }
        .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px dashed #eee; padding-top: 15px; }
        .guide-item { text-align: center; }
        .guide-item span { font-size: 0.75rem; color: #888; }
        .guide-item div { font-weight: bold; font-size: 1.1rem; color: var(--buy); margin-top: 4px; }
        .drawdown-info { font-size: 0.65rem; color: #999; margin-top: 2px; }

        /* 상세 하락률 정보 */
        .drawdown-details { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #eee; }
        .drawdown-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.8rem; }
        .drawdown-row .label { color: #666; }
        .drawdown-row .value { font-weight: bold; color: #2ecc71; }
        .drawdown-row .price { color: #888; font-size: 0.75rem; margin-left: 8px; }

        /* 입력 영역 */
        .input-row { display: grid; grid-template-columns: 1.2fr 1fr 60px; gap: 8px; margin-top: 10px; }
        input[type="number"] { padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .add-btn { background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* 리스트 항목 */
        .trade-item { background: white; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid #eee; position: relative; overflow: hidden; }
        .trade-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--sell); }
        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .buy-record { font-size: 0.8rem; color: #888; }
        .sell-target-label { font-size: 0.75rem; color: #666; font-weight: bold; }
        .sell-target-price { color: var(--sell); font-weight: 800; font-size: 1.3rem; }
        
        .check-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #eee; background: #fff; color: #ddd; font-size: 1.3rem; cursor: pointer; transition: 0.2s; }
        .check-btn:active { background: #f0f0f0; }

        .status { font-size: 0.7rem; text-align: center; color: #bbb; margin-top: 5px; }
        .loading { text-align: center; color: #999; padding: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div style="font-weight:bold; font-size:0.9rem; margin-bottom:10px;">📊 종목 선택</div>
        <div class="ticker-selector">
            <button class="ticker-btn active" onclick="selectTicker('SOXL')">SOXL</button>
            <button class="ticker-btn" onclick="selectTicker('TQQQ')">TQQQ</button>
            <button class="ticker-btn" onclick="selectTicker('UPRO')">UPRO</button>
        </div>
        <div class="custom-ticker">
            <input type="text" id="customTicker" placeholder="다른 티커 입력 (예: NVDA)" maxlength="10">
            <button onclick="addCustomTicker()">적용</button>
        </div>
    </div>

    <div class="card">
        <div class="ticker-display" id="tickerDisplay">SOXL</div>
        <div style="text-align:center; font-size:0.8rem; color:#888;">실시간 시세</div>
        <div id="price" class="price-main">--.--</div>
        <div id="status" class="status">데이터를 불러오는 중...</div>
        
        <div class="guide-grid">
            <div class="guide-item">
                <span>오늘 종가 매수</span>
                <div id="g1">--.--</div>
            </div>
            <div class="guide-item">
                <span id="drawdownLabel">추매 가이드</span>
                <div id="g3">--.--</div>
                <div class="drawdown-info" id="drawdownInfo">계산 중...</div>
            </div>
        </div>

        <!-- 기간 선택 버튼 -->
        <div class="period-selector">
            <button class="period-btn" onclick="selectPeriod(10)">상위 10일</button>
            <button class="period-btn active" onclick="selectPeriod(25)">상위 25일</button>
            <button class="period-btn" onclick="selectPeriod(50)">상위 50일</button>
        </div>

        <!-- 상세 하락률 정보 -->
        <div class="drawdown-details" id="drawdownDetails" style="display:none;">
            <div class="drawdown-row">
                <span class="label">📉 상위 10일 평균</span>
                <span><span class="value" id="dd10">--%</span><span class="price" id="price10">($--)</span></span>
            </div>
            <div class="drawdown-row">
                <span class="label">📉 상위 25일 평균</span>
                <span><span class="value" id="dd25">--%</span><span class="price" id="price25">($--)</span></span>
            </div>
            <div class="drawdown-row">
                <span class="label">📉 상위 50일 평균</span>
                <span><span class="value" id="dd50">--%</span><span class="price" id="price50">($--)</span></span>
            </div>
        </div>

        <button onclick="fetchStockPrice()" style="width:100%; margin-top:15px; padding:8px; border:none; background:#f8f9fa; border-radius:8px; font-size:0.7rem; color:#888; cursor:pointer;">🔄 시세 새로고침</button>
    </div>

    <div class="card">
        <div style="font-weight:bold; font-size:0.9rem; margin-bottom:10px;">➕ 신규 매수 기록</div>
        <div class="input-row">
            <input type="number" id="p" step="0.01" placeholder="매수가($)">
            <input type="number" id="q" placeholder="수량">
            <button class="add-btn" onclick="add()">추가</button>
        </div>
    </div>

    <div id="list"></div>
</div>

<script>
    let currentTicker = 'SOXL';
    let currentPeriod = 25; // 기본값 25일
    let drawdownCache = {}; // 티커별 하락률 캐시
    let currentPrice = 0;
    
    function getAllItems() {
        return JSON.parse(localStorage.getItem('multi_ticker_trades') || '{}');
    }
    
    function getCurrentItems() {
        const all = getAllItems();
        return all[currentTicker] || [];
    }
    
    function saveCurrentItems(items) {
        const all = getAllItems();
        all[currentTicker] = items;
        localStorage.setItem('multi_ticker_trades', JSON.stringify(all));
    }

    function selectTicker(ticker) {
        currentTicker = ticker;
        document.querySelectorAll('.ticker-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tickerDisplay').innerText = ticker;
        document.getElementById('customTicker').value = '';
        fetchStockPrice();
        render();
    }

    function addCustomTicker() {
        const input = document.getElementById('customTicker');
        const ticker = input.value.trim().toUpperCase();
        if (!ticker) return alert('티커를 입력하세요.');
        
        currentTicker = ticker;
        document.querySelectorAll('.ticker-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tickerDisplay').innerText = ticker;
        fetchStockPrice();
        render();
    }

    function selectPeriod(days) {
        currentPeriod = days;
        document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        // 캐시된 데이터가 있으면 즉시 업데이트
        const cached = drawdownCache[currentTicker];
        if (cached && currentPrice > 0) {
            updateDrawdownUI(cached, currentPrice);
        }
    }

    async function fetchStockPrice() {
        const pEl = document.getElementById('price');
        const sEl = document.getElementById('status');
        sEl.innerText = "업데이트 중...";

        try {
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${currentTicker}?interval=1d&range=1d`)}`);
            const json = await response.json();
            const data = JSON.parse(json.contents);
            const val = data.chart.result[0].meta.regularMarketPrice;

            currentPrice = val;
            pEl.innerText = `$${val.toFixed(2)}`;
            document.getElementById('g1').innerText = `$${val.toFixed(2)}`;
            
            // 하락률 계산 및 추매 가이드 업데이트
            await calculateDrawdown(val);
            
            sEl.innerText = "최종 업데이트: " + new Date().toLocaleTimeString();
        } catch (e) {
            sEl.innerText = "데이터 로드 실패. 다시 시도해 주세요.";
            console.error(e);
        }
    }

    async function calculateDrawdown(currentPrice) {
        const drawdownInfo = document.getElementById('drawdownInfo');
        
        drawdownInfo.innerText = "하락률 계산 중...";
        
        try {
            // 캐시 확인 (1시간 유효)
            const cached = drawdownCache[currentTicker];
            if (cached && (Date.now() - cached.timestamp < 3600000)) {
                updateDrawdownUI(cached, currentPrice);
                return;
            }

            // 5년 일봉 데이터 가져오기
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${currentTicker}?interval=1d&range=5y`)}`);
            const json = await response.json();
            const data = JSON.parse(json.contents);
            
            const quotes = data.chart.result[0].indicators.quote[0];
            const closes = quotes.close.filter(c => c !== null);
            
            if (closes.length < 30) {
                throw new Error('데이터 부족');
            }

            // 일일 하락률 계산 (전날 종가 대비)
            const dailyDrops = [];
            
            for (let i = 1; i < closes.length; i++) {
                const prevClose = closes[i - 1];
                const currClose = closes[i];
                const dailyChange = ((currClose - prevClose) / prevClose) * 100;
                
                // 하락한 날만 (음수 변화율)
                if (dailyChange < 0) {
                    dailyDrops.push(Math.abs(dailyChange));
                }
            }
            
            // 최대 하락률 정렬 (큰 것부터)
            dailyDrops.sort((a, b) => b - a);
            
            // 5년간 최대 하락 상위 10개/25개/50개의 평균
            const top10 = dailyDrops.slice(0, 10);
            const top25 = dailyDrops.slice(0, 25);
            const top50 = dailyDrops.slice(0, 50);
            
            const avg10 = top10.length > 0 ? top10.reduce((a, b) => a + b, 0) / top10.length : 0;
            const avg25 = top25.length > 0 ? top25.reduce((a, b) => a + b, 0) / top25.length : 0;
            const avg50 = top50.length > 0 ? top50.reduce((a, b) => a + b, 0) / top50.length : 0;
            
            // 캐시 저장
            const cacheData = {
                avg10: avg10,
                avg25: avg25,
                avg50: avg50,
                timestamp: Date.now()
            };
            
            drawdownCache[currentTicker] = cacheData;
            updateDrawdownUI(cacheData, currentPrice);
            
        } catch (e) {
            console.error('하락률 계산 실패:', e);
            // 기본값으로 폴백
            const defaultDrawdown = 8;
            document.getElementById('g3').innerText = `$${(currentPrice * (1 - defaultDrawdown / 100)).toFixed(2)}`;
            document.getElementById('drawdownLabel').innerText = `${defaultDrawdown}% 하락시 추매`;
            drawdownInfo.innerText = `기본값 사용`;
        }
    }

    function updateDrawdownUI(cacheData, price) {
        const drawdownLabel = document.getElementById('drawdownLabel');
        const drawdownInfo = document.getElementById('drawdownInfo');
        const g3 = document.getElementById('g3');
        
        // 선택된 기간의 평균 사용
        let selectedAvg;
        if (currentPeriod === 10) selectedAvg = cacheData.avg10;
        else if (currentPeriod === 25) selectedAvg = cacheData.avg25;
        else selectedAvg = cacheData.avg50;
        
        // 메인 가이드 업데이트
        g3.innerText = `$${(price * (1 - selectedAvg / 100)).toFixed(2)}`;
        drawdownLabel.innerText = `${selectedAvg.toFixed(1)}% 하락시 추매`;
        drawdownInfo.innerText = `5년간 최대 하락 상위 ${currentPeriod}일 평균`;
        
        // 상세 정보 표시
        document.getElementById('drawdownDetails').style.display = 'block';
        
        document.getElementById('dd10').innerText = `${cacheData.avg10.toFixed(1)}%`;
        document.getElementById('price10').innerText = `($${(price * (1 - cacheData.avg10 / 100)).toFixed(2)})`;
        
        document.getElementById('dd25').innerText = `${cacheData.avg25.toFixed(1)}%`;
        document.getElementById('price25').innerText = `($${(price * (1 - cacheData.avg25 / 100)).toFixed(2)})`;
        
        document.getElementById('dd50').innerText = `${cacheData.avg50.toFixed(1)}%`;
        document.getElementById('price50').innerText = `($${(price * (1 - cacheData.avg50 / 100)).toFixed(2)})`;
    }

    function add() {
        const p = document.getElementById('p').value;
        const q = document.getElementById('q').value;
        if(!p || !q) return alert("매수가와 수량을 입력하세요.");
        
        const newItem = {
            id: Date.now(),
            p: parseFloat(p).toFixed(2),
            q: q,
            t: (parseFloat(p) * 1.05).toFixed(2)
        };
        
        const items = getCurrentItems();
        items.push(newItem);
        saveCurrentItems(items);
        
        document.getElementById('p').value = '';
        document.getElementById('q').value = '';
        render();
    }

    function remove(id) {
        if(confirm("매도가 체결되었습니까? 목록에서 삭제합니다.")) {
            const items = getCurrentItems().filter(i => i.id !== id);
            saveCurrentItems(items);
            render();
        }
    }

    function render() {
        const items = getCurrentItems();
        const root = document.getElementById('list');
        root.innerHTML = items.length ? '' : '<div style="text-align:center; color:#ccc; padding:40px; font-size:0.9rem;">매수 기록이 없습니다.</div>';
        
        [...items].reverse().forEach(i => {
            root.innerHTML += `
                <div class="trade-item">
                    <div class="item-info">
                        <span class="buy-record">${currentTicker} 매수: $${i.p} (${i.q}주)</span>
                        <span class="sell-target-label">5% 익절 예약가 (LOC)</span>
                        <span class="sell-target-price">$${i.t}</span>
                    </div>
                    <button class="check-btn" onclick="remove(${i.id})">✓</button>
                </div>
            `;
        });
    }

    window.onload = () => { 
        fetchStockPrice(); 
        render(); 
    };
</script>
</body>
</html>
