<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOXL 5% 매도 매니저</title>
    <style>
        :root { --primary: #007bff; --buy: #ff4d4d; --sell: #2ecc71; --bg: #f2f4f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .card { background: #fff; padding: 18px; border-radius: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        /* 상단 시세 박스 */
        .price-main { font-size: 2.8rem; font-weight: 800; color: var(--primary); text-align: center; margin: 5px 0; }
        .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px dashed #eee; padding-top: 15px; }
        .guide-item { text-align: center; }
        .guide-item span { font-size: 0.75rem; color: #888; }
        .guide-item div { font-weight: bold; font-size: 1.1rem; color: var(--buy); margin-top: 4px; }

        /* 입력 영역 */
        .input-row { display: grid; grid-template-columns: 1.2fr 1fr 60px; gap: 8px; margin-top: 10px; }
        input { padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .add-btn { background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* 리스트 항목 (5% 매도 강조) */
        .trade-item { background: white; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid #eee; position: relative; overflow: hidden; }
        .trade-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--sell); }
        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .buy-record { font-size: 0.8rem; color: #888; }
        .sell-target-label { font-size: 0.75rem; color: #666; font-weight: bold; }
        .sell-target-price { color: var(--sell); font-weight: 800; font-size: 1.3rem; }
        
        .check-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #eee; background: #fff; color: #ddd; font-size: 1.3rem; cursor: pointer; transition: 0.2s; }
        .check-btn:active { background: #f0f0f0; }

        .status { font-size: 0.7rem; text-align: center; color: #bbb; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div style="text-align:center; font-size:0.8rem; color:#888;">SOXL 실시간 시세</div>
        <div id="price" class="price-main">--.--</div>
        <div id="status" class="status">데이터를 불러오는 중...</div>
        
        <div class="guide-grid">
            <div class="guide-item">
                <span>오늘 종가 매수</span>
                <div id="g1">--.--</div>
            </div>
            <div class="guide-item">
                <span>-8% 추매</span>
                <div id="g3">--.--</div>
            </div>
        </div>
        <button onclick="fetchStockPrice()" style="width:100%; margin-top:15px; padding:8px; border:none; background:#f8f9fa; border-radius:8px; font-size:0.7rem; color:#888; cursor:pointer;">🔄 시세 새로고침</button>
    </div>

    <div class="card">
        <div style="font-weight:bold; font-size:0.9rem; margin-bottom:10px;">➕ 신규 매수 기록</div>
        <div class="input-row">
            <input type="number" id="p" step="0.01" placeholder="매수가($)">
            <input type="number" id="q" placeholder="수량">
            <button class="add-btn" onclick="add()">추가</button>
        </div>
    </div>

    <div id="list"></div>
</div>

<script>
    let items = JSON.parse(localStorage.getItem('soxl_v4') || '[]');

    async function fetchStockPrice() {
        const pEl = document.getElementById('price');
        const sEl = document.getElementById('status');
        sEl.innerText = "업데이트 중...";

        try {
            // AllOrigins 프록시를 통해 야후 데이터 호출 (보안성 강화)
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/SOXL?interval=1d&range=1d')}`);
            const json = await response.json();
            const data = JSON.parse(json.contents);
            const val = data.chart.result[0].meta.regularMarketPrice;

            pEl.innerText = `$${val.toFixed(2)}`;
            document.getElementById('g1').innerText = `$${val.toFixed(2)}`;
            document.getElementById('g3').innerText = `$${(val * 0.92).toFixed(2)}`;
            sEl.innerText = "최종 업데이트: " + new Date().toLocaleTimeString();
        } catch (e) {
            sEl.innerText = "데이터 로드 실패. 다시 시도해 주세요.";
            console.error(e);
        }
    }

    function add() {
        const p = document.getElementById('p').value;
        const q = document.getElementById('q').value;
        if(!p || !q) return alert("매수가와 수량을 입력하세요.");
        
        const newItem = {
            id: Date.now(),
            p: parseFloat(p).toFixed(2),
            q: q,
            t: (parseFloat(p) * 1.05).toFixed(2) // 5% 매도 가이드 계산
        };
        
        items.push(newItem);
        save();
        document.getElementById('p').value = '';
        document.getElementById('q').value = '';
    }

    function remove(id) {
        if(confirm("매도가 체결되었습니까? 목록에서 삭제합니다.")) {
            items = items.filter(i => i.id !== id);
            save();
        }
    }

    function save() {
        localStorage.setItem('soxl_v4', JSON.stringify(items));
        render();
    }

    function render() {
        const root = document.getElementById('list');
        root.innerHTML = items.length ? '' : '<div style="text-align:center; color:#ccc; padding:40px; font-size:0.9rem;">매수 기록이 없습니다.</div>';
        
        [...items].reverse().forEach(i => {
            root.innerHTML += `
                <div class="trade-item">
                    <div class="item-info">
                        <span class="buy-record">매수: $${i.p} (${i.q}주)</span>
                        <span class="sell-target-label">5% 익절 예약가 (LOC)</span>
                        <span class="sell-target-price">$${i.t}</span>
                    </div>
                    <button class="check-btn" onclick="remove(${i.id})">✓</button>
                </div>
            `;
        });
    }

    window.onload = () => { fetchStockPrice(); render(); };
</script>
</body>
</html>
