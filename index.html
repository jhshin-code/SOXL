<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 매도 매니저</title>
    <style>
        :root { --primary: #007bff; --buy: #ff4d4d; --sell: #2ecc71; --bg: #f2f4f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .card { background: #fff; padding: 18px; border-radius: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        .ticker-selector { display: flex; gap: 8px; margin-bottom: 15px; }
        .ticker-btn { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 10px; background: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .ticker-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .custom-ticker { display: flex; gap: 8px; margin-top: 8px; }
        .custom-ticker input { flex: 1; padding: 10px; border: 2px solid #eee; border-radius: 10px; font-size: 0.9rem; text-transform: uppercase; }
        .custom-ticker button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .ticker-display { text-align: center; font-size: 1.2rem; font-weight: bold; color: #666; margin-bottom: 5px; }
        .price-main { font-size: 2.8rem; font-weight: 800; color: var(--primary); text-align: center; margin: 5px 0; }
        
        .guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px dashed #eee; padding-top: 15px; }
        .guide-item { 
            text-align: center; 
            padding: 12px; 
            border-radius: 12px; 
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        .guide-item.loading { opacity: 0.5; }
        .guide-label { font-size: 0.7rem; color: #666; font-weight: bold; margin-bottom: 4px; }
        .guide-percent { font-size: 0.85rem; color: #ff4d4d; font-weight: bold; margin-bottom: 6px; }
        .guide-price { font-weight: bold; font-size: 1.2rem; color: #2ecc71; }
        .guide-info { font-size: 0.6rem; color: #999; margin-top: 4px; }

        .current-price-box {
            text-align: center;
            padding: 10px;
            margin-top: 15px;
            border-radius: 10px;
            background: #f8f9fa;
        }
        .current-price-box .label { font-size: 0.75rem; color: #888; }
        .current-price-box .value { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-top: 4px; }

        .input-row { display: grid; grid-template-columns: 1.2fr 1fr 60px; gap: 8px; margin-top: 10px; }
        input[type="number"] { padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; width: 100%; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--primary); }
        .add-btn { background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .trade-item { background: white; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid #eee; position: relative; overflow: hidden; }
        .trade-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--sell); }
        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .buy-record { font-size: 0.8rem; color: #888; }
        .sell-target-label { font-size: 0.75rem; color: #666; font-weight: bold; }
        .sell-target-price { color: var(--sell); font-weight: 800; font-size: 1.3rem; }
        
        .check-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #eee; background: #fff; color: #ddd; font-size: 1.3rem; cursor: pointer; transition: 0.2s; }
        .check-btn:active { background: #f0f0f0; }

        .status { font-size: 0.7rem; text-align: center; color: #bbb; margin-top: 8px; }

        .source-badge {
            display: inline-block;
            font-size: 0.6rem;
            background: #e8f4fd;
            color: #007bff;
            padding: 2px 6px;
            border-radius: 20px;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div style="font-weight:bold; font-size:0.9rem; margin-bottom:10px;">📊 종목 선택</div>
        <div class="ticker-selector">
            <button class="ticker-btn active" onclick="selectTicker('SOXL', this)">SOXL</button>
            <button class="ticker-btn" onclick="selectTicker('TQQQ', this)">TQQQ</button>
            <button class="ticker-btn" onclick="selectTicker('UPRO', this)">UPRO</button>
        </div>
        <div class="custom-ticker">
            <input type="text" id="customTicker" placeholder="다른 티커 입력 (예: NVDA)" maxlength="10">
            <button onclick="addCustomTicker()">적용</button>
        </div>
    </div>

    <div class="card">
        <div class="ticker-display" id="tickerDisplay">SOXL</div>
        <div style="text-align:center; font-size:0.8rem; color:#888;">실시간 시세 <span class="source-badge" id="sourceBadge">-</span></div>
        <div id="price" class="price-main">--.--</div>
        
        <div class="guide-grid">
            <div class="guide-item">
                <div class="guide-label">📍 고정 전략</div>
                <div class="guide-percent">-8.0% 하락시</div>
                <div class="guide-price" id="fixed8">$--.--</div>
                <div class="guide-info">기본 추매가</div>
            </div>
            
            <div class="guide-item" id="dynamicGuide">
                <div class="guide-label">📊 동적 전략</div>
                <div class="guide-percent" id="dynamicPercent">계산중...</div>
                <div class="guide-price" id="dynamic30">$--.--</div>
                <div class="guide-info">1년 상위 30일</div>
            </div>
        </div>

        <div class="current-price-box">
            <div class="label">💰 오늘 종가 매수</div>
            <div class="value" id="currentBuy">$--.--</div>
        </div>

        <div class="status" id="status">데이터를 불러오는 중...</div>
        <button onclick="fetchStockPrice()" style="width:100%; margin-top:10px; padding:8px; border:none; background:#f8f9fa; border-radius:8px; font-size:0.7rem; color:#888; cursor:pointer;">🔄 시세 새로고침</button>
    </div>

    <div class="card">
        <div style="font-weight:bold; font-size:0.9rem; margin-bottom:10px;">➕ 신규 매수 기록</div>
        <div class="input-row">
            <input type="number" id="p" step="0.01" placeholder="매수가($)">
            <input type="number" id="q" placeholder="수량">
            <button class="add-btn" onclick="add()">추가</button>
        </div>
    </div>

    <div id="list"></div>
</div>

<script>
    let currentTicker = 'SOXL';
    let drawdownCache = {};

    function getAllItems() {
        return JSON.parse(localStorage.getItem('multi_ticker_trades') || '{}');
    }
    function getCurrentItems() {
        return getAllItems()[currentTicker] || [];
    }
    function saveCurrentItems(items) {
        const all = getAllItems();
        all[currentTicker] = items;
        localStorage.setItem('multi_ticker_trades', JSON.stringify(all));
    }

    function selectTicker(ticker, btn) {
        currentTicker = ticker;
        document.querySelectorAll('.ticker-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        document.getElementById('tickerDisplay').innerText = ticker;
        document.getElementById('customTicker').value = '';
        fetchStockPrice();
        render();
    }

    function addCustomTicker() {
        const input = document.getElementById('customTicker');
        const ticker = input.value.trim().toUpperCase();
        if (!ticker) return alert('티커를 입력하세요.');
        currentTicker = ticker;
        document.querySelectorAll('.ticker-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tickerDisplay').innerText = ticker;
        fetchStockPrice();
        render();
    }

    // ─── API 시도 목록 ───────────────────────────────────────────────

    // 1) Yahoo Finance via corsproxy.io
    async function tryYahooCorsProxy(ticker) {
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error('corsproxy fail');
        const json = await res.json();
        return json.chart.result[0].meta.regularMarketPrice;
    }

    // 2) Yahoo Finance via allorigins (원래 방식)
    async function tryYahooAllOrigins(ticker) {
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error('allorigins fail');
        const json = await res.json();
        const data = JSON.parse(json.contents);
        return data.chart.result[0].meta.regularMarketPrice;
    }

    // 3) Yahoo Finance v7 Quote via allorigins
    async function tryYahooV7(ticker) {
        const url = `https://query2.finance.yahoo.com/v7/finance/quote?symbols=${ticker}`;
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error('v7 fail');
        const json = await res.json();
        const data = JSON.parse(json.contents);
        return data.quoteResponse.result[0].regularMarketPrice;
    }

    // 4) Yahoo Finance via cors-anywhere (공용)
    async function tryYahooCorsAnywhere(ticker) {
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
        const res = await fetch(`https://cors-anywhere.herokuapp.com/${url}`, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        if (!res.ok) throw new Error('cors-anywhere fail');
        const json = await res.json();
        return json.chart.result[0].meta.regularMarketPrice;
    }

    // 5) Stooq CSV (US 주식은 심볼.US)
    async function tryStooq(ticker) {
        const sym = ticker.toUpperCase();
        const url = `https://stooq.com/q/l/?s=${sym}.US&f=sd2t2ohlcv&h&e=csv`;
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error('stooq allorigins fail');
        const json = await res.json();
        const lines = json.contents.trim().split('\n');
        if (lines.length < 2) throw new Error('stooq no data');
        const cols = lines[1].split(',');
        // Stooq CSV: Symbol,Date,Time,Open,High,Low,Close,Volume
        const close = parseFloat(cols[6]);
        if (isNaN(close)) throw new Error('stooq parse fail');
        return close;
    }

    // ─── 메인 fetch (폴백 체인) ──────────────────────────────────────
    async function fetchStockPrice() {
        const pEl = document.getElementById('price');
        const sEl = document.getElementById('status');
        const badgeEl = document.getElementById('sourceBadge');
        sEl.innerText = "업데이트 중...";
        pEl.style.opacity = 0.5;

        const attempts = [
            { fn: tryYahooCorsProxy,    label: 'Yahoo(1)' },
            { fn: tryYahooAllOrigins,   label: 'Yahoo(2)' },
            { fn: tryYahooV7,           label: 'Yahoo(3)' },
            { fn: tryStooq,             label: 'Stooq'    },
            { fn: tryYahooCorsAnywhere, label: 'Yahoo(4)' },
        ];

        let price = null;
        let usedLabel = '-';

        for (const a of attempts) {
            try {
                price = await a.fn(currentTicker);
                if (price && price > 0) { usedLabel = a.label; break; }
            } catch (e) {
                console.warn(`[${a.label}] 실패:`, e.message);
            }
        }

        pEl.style.opacity = 1;

        if (!price) {
            sEl.innerText = "⚠️ 모든 시세 소스 실패. 잠시 후 다시 시도해 주세요.";
            badgeEl.innerText = '실패';
            return;
        }

        pEl.innerText = `$${price.toFixed(2)}`;
        badgeEl.innerText = usedLabel;
        document.getElementById('fixed8').innerText = `$${(price * 0.92).toFixed(2)}`;
        document.getElementById('currentBuy').innerText = `$${price.toFixed(2)}`;
        sEl.innerText = "최종 업데이트: " + new Date().toLocaleTimeString();

        calculateDrawdown(price);
    }

    // ─── 동적 하락률 계산 (1년 데이터) ──────────────────────────────
    async function calculateDrawdown(currentPrice) {
        const dynamicGuide = document.getElementById('dynamicGuide');
        const dynamicPercent = document.getElementById('dynamicPercent');
        const dynamic30 = document.getElementById('dynamic30');

        dynamicGuide.classList.add('loading');
        dynamicPercent.innerText = '계산중...';

        const cached = drawdownCache[currentTicker];
        if (cached && (Date.now() - cached.timestamp < 3600000)) {
            updateDynamicUI(cached.avg30, currentPrice);
            return;
        }

        // 1년 데이터는 Yahoo만 가져올 수 있음 - 여러 프록시 시도
        const rangeAttempts = [
            async () => {
                const url = `https://query1.finance.yahoo.com/v8/finance/chart/${currentTicker}?interval=1d&range=1y`;
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
                const json = await res.json();
                return json.chart.result[0].indicators.quote[0].close;
            },
            async () => {
                const url = `https://query1.finance.yahoo.com/v8/finance/chart/${currentTicker}?interval=1d&range=1y`;
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const json = await res.json();
                const data = JSON.parse(json.contents);
                return data.chart.result[0].indicators.quote[0].close;
            },
            async () => {
                const url = `https://query2.finance.yahoo.com/v8/finance/chart/${currentTicker}?interval=1d&range=1y`;
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const json = await res.json();
                const data = JSON.parse(json.contents);
                return data.chart.result[0].indicators.quote[0].close;
            }
        ];

        let closes = null;
        for (const fn of rangeAttempts) {
            try {
                const raw = await fn();
                closes = raw.filter(c => c !== null && !isNaN(c));
                if (closes.length >= 10) break;
            } catch (e) {
                console.warn('1년 데이터 시도 실패:', e.message);
            }
        }

        if (!closes || closes.length < 10) {
            updateDynamicUI(8.0, currentPrice);
            return;
        }

        const dailyDrops = [];
        for (let i = 1; i < closes.length; i++) {
            const change = ((closes[i] - closes[i - 1]) / closes[i - 1]) * 100;
            if (change < 0) dailyDrops.push(Math.abs(change));
        }

        dailyDrops.sort((a, b) => b - a);
        const top30 = dailyDrops.slice(0, 30);
        const avg30 = top30.length > 0 ? top30.reduce((a, b) => a + b, 0) / top30.length : 8.0;

        drawdownCache[currentTicker] = { avg30, timestamp: Date.now() };
        updateDynamicUI(avg30, currentPrice);
    }

    function updateDynamicUI(avgDrop, price) {
        document.getElementById('dynamicGuide').classList.remove('loading');
        document.getElementById('dynamicPercent').innerText = `-${avgDrop.toFixed(1)}% 하락시`;
        document.getElementById('dynamic30').innerText = `$${(price * (1 - avgDrop / 100)).toFixed(2)}`;
    }

    function add() {
        const p = document.getElementById('p').value;
        const q = document.getElementById('q').value;
        if (!p || !q) return alert("매수가와 수량을 입력하세요.");
        const items = getCurrentItems();
        items.push({ id: Date.now(), p: parseFloat(p).toFixed(2), q, t: (parseFloat(p) * 1.05).toFixed(2) });
        saveCurrentItems(items);
        document.getElementById('p').value = '';
        document.getElementById('q').value = '';
        render();
    }

    function remove(id) {
        if (confirm("매도가 체결되었습니까? 목록에서 삭제합니다.")) {
            saveCurrentItems(getCurrentItems().filter(i => i.id !== id));
            render();
        }
    }

    function render() {
        const items = getCurrentItems();
        const root = document.getElementById('list');
        root.innerHTML = items.length ? '' : '<div style="text-align:center; color:#ccc; padding:40px; font-size:0.9rem;">매수 기록이 없습니다.</div>';
        [...items].reverse().forEach(i => {
            root.innerHTML += `
                <div class="trade-item">
                    <div class="item-info">
                        <span class="buy-record">${currentTicker} 매수: $${i.p} (${i.q}주)</span>
                        <span class="sell-target-label">5% 익절 예약가 (LOC)</span>
                        <span class="sell-target-price">$${i.t}</span>
                    </div>
                    <button class="check-btn" onclick="remove(${i.id})">✓</button>
                </div>`;
        });
    }

    window.onload = () => { fetchStockPrice(); render(); };
</script>
</body>
</html>
